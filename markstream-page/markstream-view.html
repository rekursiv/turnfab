<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markstream View</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /*
         * The #app element is the scroll container, not the document
         * viewport: the sticky-bottom logic listens for 'scroll' events on
         * it, and scroll events do not bubble (a document-viewport scroll
         * only reaches 'window'/'document' listeners in this WebView).
         */
        overflow: hidden;
      }

      #app {
        height: 90%;
        overflow-y: auto;
        padding: 2em;
        scrollbar-gutter: stable;
      }

      /*
       * Override markstream-vue's font stack. The library defines
       * --ms-font-sans as `ui-sans-serif, system-ui, sans-serif,
       * "Apple Color Emoji", "Segoe UI Emoji"` — generic families first.
       * In this WebView the generic sans resolves to a font that has
       * monochrome glyphs for emoji code points, and font matching stops
       * at the first font that has the glyph, so the color emoji fonts at
       * the end of the list are never reached (B&W emojis). Putting the
       * system color emoji font first fixes that; its glyph coverage is
       * limited to emoji, so regular text still falls through to the
       * generic families. (Higher specificity than the library's
       * `.markstream-vue` rule, so it wins regardless of load order.)
       */
      #app .markstream-vue {
        --ms-font-sans: "Segoe UI Emoji", "Apple Color Emoji", ui-sans-serif,
          system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
