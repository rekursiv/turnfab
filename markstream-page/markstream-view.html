<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markstream View</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /*
         * The #app element is the scroll container, not the document
         * viewport: the sticky-bottom logic listens for 'scroll' events on
         * it, and scroll events do not bubble (a document-viewport scroll
         * only reaches 'window'/'document' listeners in this WebView).
         */
        overflow: hidden;
      }

      #app {
        height: 92%;
        overflow-y: auto;
        padding: 2em;
        scrollbar-gutter: stable;
      }

      /*
       * Override markstream-vue's font stack. The library defines
       * --ms-font-sans as `ui-sans-serif, system-ui, sans-serif,
       * "Apple Color Emoji", "Segoe UI Emoji"` — generic families first.
       &
       * This was an attempt to fix emojis, but it didn't work,
       * and it wiped out both italc and bold text.
      #app .markstream-vue {
        --ms-font-sans: "Segoe UI Emoji", "Apple Color Emoji", ui-sans-serif,
          system-ui, sans-serif;
      }
       */

      /*
       * "code header" toggle hook: the Vue wrapper adds .hide-code-headers to
       * its root div when the dev-panel button switches headers off. The #app
       * id prefix wins specificity against the library's own display rules for
       * the header row, regardless of stylesheet import order.
       */
      #app .hide-code-headers .code-block-header {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
